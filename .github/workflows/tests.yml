name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_learning_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/english_learning_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/english_learning_test
          SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long
        run: |
          python -m pytest -v